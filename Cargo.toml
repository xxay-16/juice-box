[workspace]
resolver = "2"
members = [
    "rust/hic-core",
    "rust/heatmap-core",
    "rust/heatmap-wgpu",
]

[workspace.package]
edition = "2024"
license = "MIT"
rust-version = "1.85"

[workspace.dependencies]
anyhow = "1.0"
bytemuck = { version = "1.25", features = ["derive"] }
pollster = "0.4"
thiserror = "2.0"
wgpu = "24.0"
winit = "0.30.13"
